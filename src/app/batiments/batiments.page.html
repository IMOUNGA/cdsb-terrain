<ion-header>
  <ion-toolbar>
    <ion-title>Bâtiments</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="ion-padding page-subtitle">
    <h3>Consultez l'état de santé et les informations clés des bâtiments.</h3>
  </div>

  <div>
    @for (property of properties(); track property.id) {
      <app-property-presentation-card [property]="property"/>
    }
  </div>
</ion-content>
