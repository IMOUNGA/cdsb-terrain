<ion-card (click)="logFunc(property())">
  <ion-img alt="Silhouette of mountains" src="assets/card-media.png" />

  <ion-card-header>
    <ion-card-title>{{ property().id }}</ion-card-title>
    <ion-card-subtitle>{{ property().city }} - {{ PROPERTY_USAGES[property().usage].label }}</ion-card-subtitle>
  </ion-card-header>

  <ion-card-content>
    <p>{{ property().description | truncate:200 }}</p>
  </ion-card-content>
</ion-card>
